plugins {
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // --- 既存 ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    implementation "org.flywaydb:flyway-core:11.13.2"
    implementation "org.flywaydb:flyway-database-postgresql:11.13.2"

    // --- Step0 で追加する依存関係 ---
    // 入力バリデーション（@Valid, @NotNull など）
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Actuator (healthcheck, metrics)
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Swagger / OpenAPI UI
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

    // 構造化JSONログ（Logstash Encoder）
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // --- テスト ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

configurations.all {
    resolutionStrategy {
        // 既存の Flyway バージョン固定
        force "org.flywaydb:flyway-core:11.13.2"
        force "org.flywaydb:flyway-database-postgresql:11.13.2"
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
